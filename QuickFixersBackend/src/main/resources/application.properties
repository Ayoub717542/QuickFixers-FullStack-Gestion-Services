spring.application.name=QuickFixers
server.port=${PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Aiven closes idle connections quickly; keep pool connections fresh and short-lived
# so Hikari does not try to reuse a server-closed connection ("No operations allowed after connection closed").
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-timeout=10000

jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://localhost:8081,https://quickfixers-frontend-latest.onrender.com}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.persistAuthorization=true

spring.flyway.enabled=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

spring.cache.type=redis
spring.cache.redis.time-to-live=60s
spring.cache.redis.cache-null-values=false

spring.cache.redis.key-prefix=quickfixers:v2:

emailjs.service-id=${EMAILJS_SERVICE_ID:}
emailjs.template-id=${EMAILJS_TEMPLATE_ID:}
emailjs.public-key=${EMAILJS_PUBLIC_KEY:}
emailjs.private-key=${EMAILJS_PRIVATE_KEY:}
emailjs.template-ticket-id=${EMAILJS_TEMPLATE_TICKET_ID:}

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite

