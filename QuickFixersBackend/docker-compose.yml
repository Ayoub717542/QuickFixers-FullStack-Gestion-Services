services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: QuickFixers_db

      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: quickfixers
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u quickfixers QuickFixers_db -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  backend:

    build: .
    ports:
      - "8081:8081"

    env_file:
      - .env
    environment:

      DB_URL: jdbc:mysql://mysql:3306/QuickFixers_db?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: quickfixers

    depends_on:
      mysql:
        condition: service_healthy


volumes:
  mysql_data:
