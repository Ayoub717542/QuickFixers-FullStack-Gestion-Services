# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quickfixers_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"                                                                                                                                   
          --health-interval=10s                                                                                                                                                         
          --health-timeout=5s                                                                                                                                                           
          --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/quickfixers_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: dev-ci-secret-key-for-tests-only
      MAIL_USERNAME: fake@test.com
      MAIL_APP_PASSWORD: fake
      GEMINI_API_KEY: fake-key-for-tests

    defaults:
        run:
          working-directory: QuickFixersBackend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: QuickFixersBackend/pom.xml

      - name: Check Java version
        run: |
          java -version
          mvn -version

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=Ayoub717542_QuickFixers-FullStack-Gestion-Services
          -Dsonar.organization=ayoub717542
          -Dsonar.host.url=https://sonarcloud.io
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image to GHCR
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: QuickFixersBackend
        push: true
        tags: ghcr.io/ayoub717542/quickfixers-backend:latest

    - name: Trigger Render deploy
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
      run: curl -sS "$RENDER_DEPLOY_HOOK_URL"


  deploy-frontend:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push frontend image to GHCR
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: QuickFixersFrontend
        push: true
        tags: ghcr.io/ayoub717542/quickfixers-frontend:latest
        build-args: |
          VITE_API_URL=https://quickfixers-backend-latest.onrender.com/api

    - name: Trigger Render frontend deploy
      env:
        RENDER_FRONTEND_HOOK_URL: ${{ secrets.RENDER_FRONTEND_HOOK_URL }}
      if: ${{ env.RENDER_FRONTEND_HOOK_URL != '' }}
      run: curl -sS "$RENDER_FRONTEND_HOOK_URL"
