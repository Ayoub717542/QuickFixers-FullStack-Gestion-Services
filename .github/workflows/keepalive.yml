name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Wake backend
        run: curl -fsS -o /dev/null https://quickfixers-backend-latest.onrender.com/ || true
      - name: Wake frontend
        run: curl -fsS -o /dev/null https://quickfixers-frontend-latest.onrender.com/ || true